baseURL = 'https://yagikobo.com'
languageCode = 'ja'
title = '株式会社やぎ工房'
defaultContentLanguage = 'ja'

[params]
  description = '株式会社やぎ工房の公式サイト'

[outputs]
  home = ['HTML', 'RSS']

[permalinks]
  info = "/info/:slug/"
  products = "/products/:slug/"

[build]
  writeStats = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"
    disableWatch = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = true

