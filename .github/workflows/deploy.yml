name: Deploy to GCP Cloud Storage

on:
  push:
    branches:
      - main  # メインブランチへのプッシュ時に実行

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Build Enviroments  # 環境名を指定
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Setup Node.js (for Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add node_modules/.bin to PATH
        run: echo "${{ github.workspace }}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build (Hugo)
        run: hugo --minify
        env:
          HUGO_ENVIRONMENT: production
          NODE_ENV: production

      - name: Check GCP Secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::GCP_SA_KEY secret is not set in repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "::error::GCP_PROJECT_ID secret is not set in repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_BUCKET_NAME }}" ]; then
            echo "::error::GCP_BUCKET_NAME secret is not set in repository secrets"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Storage
        run: gsutil -m rsync -d -r public/ gs://${{ secrets.GCP_BUCKET_NAME }}/ 